name: Backup recovery

on:
  pull_request:
    branches: [staging, main]
    paths:
      - 'scripts/deployment/**'
      - '.github/workflows/backup.yml'
  push:
    branches: [staging, main]
    paths:
      - 'scripts/deployment/**'
      - '.github/workflows/backup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Prepare disposable backup fixture mount
        run: |
          command -v zstd || sudo apt-get install -y zstd
          sudo mkdir -p /mnt/vk-storage
          # Admission now reserves 2 GiB for simultaneous bounded metadata.
          # This is the disposable volume's ceiling; fixtures remain tiny.
          sudo mount -t tmpfs -o size=3G tmpfs /mnt/vk-storage
          sudo chown "$(id -u):$(id -g)" /mnt/vk-storage
          mkdir /mnt/vk-storage/backup-fixtures
      - name: Verify complete backup and restart recovery
        env:
          TMPDIR: /mnt/vk-storage/backup-fixtures
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/deployment/run_backup_tests.py
