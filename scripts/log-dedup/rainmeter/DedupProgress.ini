[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1
LeftMouseDoubleClickAction=["https://mcp-server.tail744c4.ts.net/vk-dedup-status"]

[Metadata]
Name=Deduplication Progress
Author=Vibe Kanban
Version=1.0
Information=Read-only live deduplication progress. Double-click for details.

[Variables]
White=F2F4F8
Muted=AEB7C4
Green=54D69A
Amber=F3C969
Red=FF7070
Panel=7,12,20,196
Stroke=96,176,207,118
Cyan=58,210,224,255
Magenta=223,99,255,255

[MeasureWeb]
Measure=WebParser
URL=https://mcp-server.tail744c4.ts.net/vk-dedup-status
RegExp=(?si)<!-- VK_DEDUP_HUD_V1\s+(.*?)\s+END_VK_DEDUP_HUD -->
UpdateRate=15
ForceReload=1
OnConnectErrorAction=[!CommandMeasure MeasureUI "FeedError()"]
OnRegExpErrorAction=[!CommandMeasure MeasureUI "FeedError()"]
FinishAction=[!UpdateMeasure MeasureData][!CommandMeasure MeasureUI "FeedReady()"]

[MeasureData]
Measure=WebParser
URL=[MeasureWeb]
StringIndex=1

[MeasureUI]
Measure=Script
ScriptFile=#@#progress.lua

[Bounds]
Meter=Shape
Shape=Rectangle 0,0,420,218 | Fill Color 0,0,0,1 | StrokeWidth 0
W=420
H=218

[Background]
Meter=Shape
Shape=Rectangle 12,0,396,214,10 | Fill Color #Panel# | StrokeWidth 1 | Stroke Color #Stroke#

[Accent]
Meter=Shape
Shape=Rectangle 12,10,4,194,2 | Fill LinearGradient AccentGradient | StrokeWidth 0
AccentGradient=90 | #Cyan# ; 0 | #Magenta# ; 1

[Title]
Meter=String
X=26
Y=8
Text=HISTORY DEDUP
FontFace=Segoe UI Semibold
FontSize=12
FontColor=#White#
CharacterSpacing=2
StringEffect=Shadow
FontEffectColor=0,0,0,235
AntiAlias=1

[State]
Meter=String
X=396
Y=11
W=114
H=16
Text=CONNECTING
StringAlign=Right
ClipString=1
FontFace=Cascadia Mono SemiBold
FontSize=8
FontColor=#Muted#
AntiAlias=1

[Count]
Meter=String
X=26
Y=34
W=274
Text=Waiting for live data
FontFace=Segoe UI Semibold
FontSize=12
FontColor=#White#
AntiAlias=1

[Percent]
Meter=String
X=396
Y=35
W=86
Text=--
StringAlign=Right
FontFace=Cascadia Mono
FontSize=11
FontColor=#Cyan#
AntiAlias=1

[BarBack]
Meter=Shape
Shape=Rectangle 26,61,370,4,2 | Fill Color 45,55,70,220 | StrokeWidth 0

[BarFill]
Meter=Shape
Shape=Rectangle 26,61,0,4,2 | Fill Color #Cyan# | StrokeWidth 0

[Verified]
Meter=String
X=26
Y=74
W=370
Text=Verified logs / completed batches
ClipString=1
FontFace=Cascadia Mono
FontSize=8
FontColor=#Muted#
AntiAlias=1

[Space]
Meter=String
X=26
Y=97
W=370
Text=Log space recovered: --
FontFace=Segoe UI Semibold
FontSize=11
FontColor=#Cyan#
AntiAlias=1
ToolTipText=Allocated live-log reduction, including shared objects. Final net filesystem savings also require staging and growth accounting.

[Processed]
