name: Scheduled goal acceptance artifacts

on:
  pull_request:
    branches: [staging, main]
    paths:
      - 'crates/executors/src/capacity/**'
      - 'crates/executors/src/executors/codex/**'
      - 'crates/executors/src/routing_triage.rs'
      - 'crates/server/src/routes/capacity.rs'
      - 'crates/server/src/main.rs'
      - 'crates/server/build.rs'
      - 'crates/server/Cargo.toml'
      - 'crates/executors/Cargo.toml'
      - 'Cargo.toml'
      - 'scripts/build-scheduled-goal-artifacts.py'
      - '.github/workflows/scheduled-goal-artifacts.yml'
  workflow_dispatch:
    inputs:
      frontend_only:
        description: Build only the source-bound local frontend; no backend artifact
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: scheduled-goal-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || !inputs.frontend_only
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/../vk-scheduled-goal-target
      VK_EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.VK_EXPECTED_SOURCE }}
          persist-credentials: false
      - uses: ./.github/actions/cargo-checks-common-setup
        with:
          toolchain: nightly-2025-12-04
          cache-key: scheduled-goal-artifacts-${{ runner.os }}-${{ runner.arch }}
      - name: Setup frontend toolchain
        uses: ./.github/actions/setup-node
      - name: Install source-locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify required formatting
        run: |
          pnpm run format
          git diff --exit-code
      - name: Install required module sandbox dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap apparmor-profiles
          # Ubuntu-authenticated profile, loaded only on this disposable runner.
          # Keep the build script's namespace prerequisite mandatory.
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
      - name: Build source-fenced HTTP, rollback and test artifacts
        env:
          VK_ARTIFACT_DIR: ${{ runner.temp }}/vk-scheduled-goal-artifacts
        run: python3 -B scripts/build-scheduled-goal-artifacts.py
      - uses: actions/upload-artifact@v6
        with:
          name: scheduled-goal-${{ env.VK_EXPECTED_SOURCE }}
          path: ${{ runner.temp }}/vk-scheduled-goal-artifacts
          retention-days: 14
          if-no-files-found: error

  frontend-only:
    if: github.event_name == 'workflow_dispatch' && inputs.frontend_only
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_VERSION: 22
      PNPM_VERSION: 10.13.1
      NODE_OPTIONS: --max-old-space-size=4096
      VITE_DOT_SIDECHAT: '1'
      VITE_DOT_SIDECHAT_FIXTURE: '0'
      SENTRY_TELEMETRY: 'false'
      VK_EXPECTED_SOURCE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.VK_EXPECTED_SOURCE }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Install source-locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and seal the exact local frontend
        run: |
          test "$(git rev-parse HEAD)" = "$VK_EXPECTED_SOURCE"
          pnpm --filter @vibe/local-web exec vite build --sourcemap false
          git diff --exit-code
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,shutil,subprocess
          root=pathlib.Path('packages/local-web/dist')
          assert (root/'index.html').is_file()
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'vk-frontend-artifact'
          shutil.copytree(root,output/'frontend')
          files={str(p.relative_to(root)):{'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size} for p in sorted(root.rglob('*')) if p.is_file()}
          manifest={'source':os.environ['VK_EXPECTED_SOURCE'],'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'members':files,'backend_built':False,'runtime_acceptance':'not performed by builder'}
          (output/'frontend-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PYCODE
      - uses: actions/upload-artifact@v6
        with:
          name: frontend-only-${{ env.VK_EXPECTED_SOURCE }}
          path: ${{ runner.temp }}/vk-frontend-artifact
          retention-days: 14
          if-no-files-found: error
