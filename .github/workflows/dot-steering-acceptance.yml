name: Dot steering acceptance artifact
on:
  pull_request:
    branches: [staging]
    paths:
      - 'crates/executors/src/executors/codex/**'
      - 'crates/executors/src/executors/codex.rs'
      - 'crates/executors/src/executors/claude.rs'
      - 'crates/executors/src/executors/claude/**'
      - 'crates/executors/src/approvals.rs'
      - 'crates/services/src/services/approvals/**'
      - 'crates/services/src/services/approvals.rs'
      - 'scripts/dot-connector/**'
      - '.github/workflows/dot-steering-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dot-steering-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  executor-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      VK_EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.VK_EXPECTED_SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ./.github/actions/cargo-checks-common-setup
        with:
          toolchain: nightly-2025-12-04
          cache-key: backend-test-Linux-X64-ubuntu-24.04
      - name: Verify steering protocol fixture without account access
        run: cargo test --locked -p executors --lib steering_
      - name: Verify Claude approval preview and genuine consent bridge
        run: |
          cargo test --locked -p executors --lib approval_context::tests
          cargo test --locked -p executors --lib permission_tests
          cargo test --locked -p executors --lib permission_boundary::tests
          cargo test --locked -p executors --lib native_review_
          cargo test --locked -p services --lib claude_approval_tests -- --test-threads=1
      - name: Verify pinned Claude native permissions without provider access
        run: |
          npm install --prefix "$RUNNER_TEMP/claude-native-legacy" --ignore-scripts --no-audit --no-fund @anthropic-ai/claude-code@2.1.62
          npm install --prefix "$RUNNER_TEMP/claude-native-fixture" --ignore-scripts --no-audit --no-fund @anthropic-ai/claude-code@2.1.77
          python3 -B scripts/dot-connector/verify_claude_native_permissions.py --node "$(command -v node)" --cli "$RUNNER_TEMP/claude-native-fixture/node_modules/@anthropic-ai/claude-code/cli.js" --legacy-cli "$RUNNER_TEMP/claude-native-legacy/node_modules/@anthropic-ai/claude-code/cli.js"
      - name: Test connector and overlay preparation
        run: python3 -B -m unittest discover -s scripts/dot-connector -p 'test_*.py' -v
      - name: Export source-bound executor test binary
        env:
          VK_STEERING_TEST_ARTIFACT: ${{ runner.temp }}/dot-steering-artifact
        run: |
          cargo test --locked -p executors --lib --no-run --message-format=json > "$RUNNER_TEMP/dot-steering-tests.jsonl"
          python3 -B scripts/dot-connector/export_test_artifact.py "$RUNNER_TEMP/dot-steering-tests.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: dot-steering-${{ env.VK_EXPECTED_SOURCE }}
          path: ${{ runner.temp }}/dot-steering-artifact/
          retention-days: 14
          if-no-files-found: error
