name: Test

on:
  pull_request:
    branches:
      - staging
      - main
    paths-ignore:
      - .github/workflows/**
      - "!.github/workflows/test.yml"
  push:
    branches:
      - staging
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/staging' }}

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: 22
  PNPM_VERSION: 10.13.1
  RUST_TOOLCHAIN: nightly-2025-12-04
  RUNNER_LABEL: &runner_label ubuntu-24.04

jobs:
  branch-policy:
    if: github.event_name == 'pull_request'
    runs-on: *runner_label
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Enforce PR branch policy
        run: node scripts/check-branch-policy.mjs "${{ github.base_ref }}" "${{ github.head_ref }}"

  branch-freshness:
    if: github.event_name == 'pull_request'
    runs-on: *runner_label
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Fetch base branch
        run: git fetch origin "${{ github.base_ref }}"

      - name: Enforce branch freshness
        run: node scripts/check-branch-freshness.mjs "${{ github.base_ref }}"

  changes:
    runs-on: *runner_label
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      backend-remote: ${{ steps.filter.outputs['backend-remote'] }}
      tauri: ${{ steps.filter.outputs.tauri }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@0bc4621a3135347011ad047f9ecf449bf72ce2bd # v3.0.0
        id: filter
        with:
          filters: |
            frontend:
              - 'packages/local-web/**'
              - 'packages/web-core/**'
              - 'packages/remote-web/**'
              - 'packages/ui/**'
              - 'shared/**'
              - 'scripts/testing/kanban-issue-panel*'
              - 'scripts/testing/run-kanban-issue-panel-tests.mjs'
              - 'scripts/check-i18n.sh'
              - 'scripts/check-unused-i18n-keys.mjs'
              - 'scripts/check-legacy-frontend-paths.sh'
              - 'scripts/legacy-frontend-paths-allowlist.txt'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.npmrc'
              - '.github/workflows/test.yml'
              - '.github/actions/**'
              - 'AGENTS.md'
              - 'REPO_IDENTITY.md'
              - 'STATE.md'
              - 'STREAM.md'
              - 'HANDOFF.md'
              - 'DELTA.md'
              - 'docs/audits/**'
              - 'docs/operations/**'
            backend:
              - 'crates/api-types/**'
              - 'crates/client-info/**'
              - 'crates/db/**'
              - 'crates/deployment/**'
              - 'crates/desktop-bridge/**'
              - 'crates/embedded-ssh/**'
              - 'crates/executors/**'
              - 'crates/git/**'
              - 'crates/git-host/**'
              - 'crates/local-deployment/**'
              - 'crates/mcp/**'
              - 'crates/preview-proxy/**'
              - 'crates/relay-client/**'
              - 'crates/relay-control/**'
              - 'crates/relay-hosts/**'
              - 'crates/relay-protocol/**'
              - 'crates/relay-tunnel-core/**'
              - 'crates/relay-types/**'
              - 'crates/relay-webrtc/**'
              - 'crates/relay-ws/**'
              - 'crates/remote-info/**'
              - 'crates/review/**'
              - 'crates/server/**'
              - 'crates/services/**'
              - 'crates/trusted-key-auth/**'
              - 'crates/utils/**'
              - 'crates/workspace-manager/**'
              - 'crates/worktree-manager/**'
              - 'crates/ws-bridge/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'shared/**'
              - 'scripts/prepare-db.js'
              - 'scripts/verify_recovered_tree.py'
              - 'scripts/testing/startup-recovery-safety/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'rustfmt.toml'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.github/workflows/test.yml'
              - '.github/actions/**'
              - 'AGENTS.md'
              - 'REPO_IDENTITY.md'
              - 'STATE.md'
              - 'STREAM.md'
              - 'HANDOFF.md'
              - 'DELTA.md'
              - 'docs/audits/**'
              - 'docs/operations/**'
            backend-remote:
              - 'crates/remote/**'
              - 'crates/relay-tunnel/**'
              - 'crates/relay-tunnel-core/**'
              - 'crates/ws-bridge/**'
              - 'crates/api-types/**'
              - 'crates/relay-types/**'
              - 'crates/utils/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'shared/**'
              - 'rustfmt.toml'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - '.github/workflows/test.yml'
              - '.github/actions/**'
              - 'AGENTS.md'
              - 'REPO_IDENTITY.md'
              - 'STATE.md'
              - 'STREAM.md'
              - 'HANDOFF.md'
              - 'DELTA.md'
              - 'docs/audits/**'
              - 'docs/operations/**'
            tauri:
              - 'crates/tauri-app/**'
              - 'crates/api-types/**'
              - 'crates/client-info/**'
              - 'crates/db/**'
              - 'crates/deployment/**'
              - 'crates/desktop-bridge/**'
              - 'crates/embedded-ssh/**'
              - 'crates/executors/**'
              - 'crates/git/**'
              - 'crates/git-host/**'
              - 'crates/local-deployment/**'
              - 'crates/mcp/**'
              - 'crates/preview-proxy/**'
              - 'crates/relay-client/**'
              - 'crates/relay-control/**'
              - 'crates/relay-hosts/**'
              - 'crates/relay-protocol/**'
              - 'crates/relay-tunnel-core/**'
              - 'crates/relay-types/**'
              - 'crates/relay-webrtc/**'
              - 'crates/relay-ws/**'
              - 'crates/remote-info/**'
              - 'crates/review/**'
              - 'crates/server/**'
              - 'crates/services/**'
              - 'crates/trusted-key-auth/**'
              - 'crates/utils/**'
              - 'crates/workspace-manager/**'
              - 'crates/worktree-manager/**'
              - 'crates/ws-bridge/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rustfmt.toml'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - '.github/workflows/test.yml'
              - '.github/actions/**'
              - 'AGENTS.md'
              - 'REPO_IDENTITY.md'
              - 'STATE.md'
              - 'STREAM.md'
              - 'HANDOFF.md'
              - 'DELTA.md'
              - 'docs/audits/**'
              - 'docs/operations/**'

  turn-git-preservation-contract:
    runs-on: *runner_label
    steps:
      - uses: actions/checkout@v6
      - name: Prepare pinned real scanner
        env:
          VK_SCANNER_OUTPUT: ${{ runner.temp }}/vk-release-scanner
        run: python3 scripts/testing/prepare-release-scanner.py
      - name: Test preservation against isolated Git fixtures
        env:
          VK_PRESERVATION_TEST_ROOT: ${{ runner.temp }}
          VK_TEST_GITLEAKS: ${{ runner.temp }}/vk-release-scanner/gitleaks
        run: python3 scripts/preservation/test_turn_git.py

  ops-governance:
    runs-on: *runner_label
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Run ops governance checks
        run: pnpm run ops:check

  frontend-checks:
    needs: [branch-policy, branch-freshness, changes]
    if: always() && (needs.branch-policy.result == 'success' || github.event_name == 'workflow_dispatch') && (needs.branch-freshness.result == 'success' || github.event_name == 'workflow_dispatch') && (needs.changes.outputs.frontend == 'true' || needs.changes.result == 'skipped')
    runs-on: *runner_label
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: pnpm install

      - name: Run frontend checks
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          npx concurrently \
            --kill-others-on-fail \
            --names "local:lint,local:fmt,local:build,remote:fmt,remote:build,ui:check,ui:lint,ui:fmt,core:check,core:fmt,i18n,i18n:unused,legacy" \
            --timings \
            "cd packages/local-web && npm run lint" \
            "cd packages/local-web && npm run format:check" \
            "cd packages/local-web && npm run build" \
            "cd packages/remote-web && npm run format:check" \
            "cd packages/remote-web && npm run build" \
            "cd packages/ui && npm run check" \
            "cd packages/ui && npm run lint" \
            "cd packages/ui && npm run format:check" \
            "cd packages/web-core && npm run check" \
            "cd packages/web-core && npm run format:check" \
            "GITHUB_BASE_REF=${{ github.base_ref || 'main' }} ./scripts/check-i18n.sh" \
            "node scripts/check-unused-i18n-keys.mjs" \
            "./scripts/check-legacy-frontend-paths.sh"

      - name: Check issue creation persistence, local assignments and workspace pagination
        run: node --experimental-strip-types --test packages/web-core/src/shared/lib/issueCreation.test.ts packages/web-core/src/pages/workspaces/workspaceAssignmentFilter.test.ts packages/web-core/src/pages/workspaces/workspaceSidebarPagination.test.ts

      - name: Check actual issue panel Close/reopen races
        env:
          VK_TEST_OUTPUT: ${{ runner.temp }}/kanban-issue-panel-tests
          TEST_RENDERER_PATH: ${{ runner.temp }}/kanban-issue-panel-tools/node_modules/react-test-renderer
        run: |
          npm install --prefix "${{ runner.temp }}/kanban-issue-panel-tools" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund react-test-renderer@18.3.1
          node scripts/testing/run-kanban-issue-panel-tests.mjs

      - name: Test offline MCP approval UI contract
        env:
          VK_TEST_OUTPUT: ${{ runner.temp }}/vk-mcp-approval-tests
        run: node scripts/testing/run-mcp-approval-ui-tests.mjs

  backend-schema-checks:
    needs: [branch-policy, branch-freshness, changes]
    if: always() && (needs.branch-policy.result == 'success' || github.event_name == 'workflow_dispatch') && (needs.branch-freshness.result == 'success' || github.event_name == 'workflow_dispatch') && (needs.changes.outputs.backend == 'true' || needs.changes.result == 'skipped')
    runs-on: *runner_label
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/cargo-checks-common-setup
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache-key: backend-schema-checks-${{ runner.os }}-${{ runner.arch }}-${{ env.RUNNER_LABEL }}
          setup-node: "true"
          setup-sqlx-cli: "true"

      - name: Check generated types
        run: npm run generate-types:check

      - name: Sqlx checks
        run: npm run prepare-db:check

  backend-remote-checks:
    needs: [branch-policy, branch-freshness, changes]
    if: >-
      always()
      && (needs.branch-policy.result == 'success' || github.event_name == 'workflow_dispatch')
      && (needs.branch-freshness.result == 'success' || github.event_name == 'workflow_dispatch')
      && (needs.changes.outputs['backend-remote'] == 'true' || needs.changes.result == 'skipped')
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: *runner_label
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      VK_PRIVATE_DEPLOY_KEY: ${{ secrets.VK_PRIVATE_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v6

      - name: Skip backend remote checks without deploy key
        if: ${{ env.VK_PRIVATE_DEPLOY_KEY == '' }}
        run: echo "::notice::VK_PRIVATE_DEPLOY_KEY is not configured; skipping backend remote checks that require private dependencies."

      - name: Setup Rust
        if: ${{ env.VK_PRIVATE_DEPLOY_KEY != '' }}
        uses: ./.github/actions/cargo-checks-common-setup
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          cache-key: backend-remote-checks-${{ runner.os }}-${{ runner.arch }}-${{ env.RUNNER_LABEL }}
          setup-node: "true"
          setup-sqlx-cli: "true"

      - name: Setup SSH Agent for private dependencies
        if: ${{ env.VK_PRIVATE_DEPLOY_KEY != '' }}
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ env.VK_PRIVATE_DEPLOY_KEY }}

      - name: Check remote Cargo.lock is consistent
        if: ${{ env.VK_PRIVATE_DEPLOY_KEY != '' }}
        run: |
          cargo metadata --locked --format-version 1 --manifest-path crates/remote/Cargo.toml > /dev/null
          cargo metadata --locked --format-version 1 --manifest-path crates/relay-tunnel/Cargo.toml > /dev/null

      - name: Check formatting
        if: ${{ env.VK_PRIVATE_DEPLOY_KEY != '' }}
        run: |
          cargo fmt --all --manifest-path crates/remote/Cargo.toml -- --check
          cargo fmt --all --manifest-path crates/relay-tunnel/Cargo.toml -- --check

      - name: Run Clippy
        if: ${{ env.VK_PRIVATE_DEPLOY_KEY != '' }}
        run: |
          cargo clippy --all-targets --manifest-path crates/remote/Cargo.toml -- -D warnings
          cargo clippy --all-targets --manifest-path crates/relay-tunnel/Cargo.toml -- -D warnings

      - name: Check generated types
        if: ${{ env.VK_PRIVATE_DEPLOY_KEY != '' }}
        run: npm run remote:generate-types:check

      - name: Sqlx checks
        if: ${{ env.VK_PRIVATE_DEPLOY_KEY != '' }}
        run: npm run remote:prepare-db:check

  backend-clippy:
    needs: [branch-policy, branch-freshness, changes]
    if: always() && (needs.branch-policy.result == 'success' || github.event_name == 'workflow_dispatch') && (needs.branch-freshness.result == 'success' || github.event_name == 'workflow_dispatch') && (needs.changes.outputs.backend == 'true' || needs.changes.result == 'skipped')
    runs-on: *runner_label
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/cargo-checks-common-setup
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          cache-key: backend-clippy-${{ runner.os }}-${{ runner.arch }}-${{ env.RUNNER_LABEL }}

      - name: Run Clippy and fmt checks
        run: |
          set -x
          cargo fmt --all -- --check & pid_fmt=$!
          cargo clippy --workspace --all-targets --exclude vibe-kanban-tauri -- -D warnings
          wait $pid_fmt

  backend-test:
    needs: [branch-policy, branch-freshness, changes]
    if: always() && (needs.branch-policy.result == 'success' || github.event_name == 'workflow_dispatch') && (needs.branch-freshness.result == 'success' || github.event_name == 'workflow_dispatch') && (needs.changes.outputs.backend == 'true' || needs.changes.result == 'skipped')
    runs-on: *runner_label
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/cargo-checks-common-setup
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache-key: backend-test-${{ runner.os }}-${{ runner.arch }}-${{ env.RUNNER_LABEL }}

      - name: Install cargo-nextest
        uses: taiki-e/cache-cargo-install-action@34ce5120836e5f9f1508d8713d7fdea0e8facd6f # v3.0.1
        with:
          tool: cargo-nextest
          git: https://github.com/nextest-rs/nextest
          rev: 6e4a9d6f2c4964f30ff54a8cd5466f8869267daa # cargo-nextest-0.9.132

      - name: Install isolated server test boundary
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor-profiles
          # Ubuntu restricts namespace capabilities for unprofiled executables.
          # Load the packaged bwrap profile only on this ephemeral CI runner.
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          bwrap --unshare-all --ro-bind / / --proc /proc --dev /dev -- true

      - name: Run read-only recovery audit regressions
        run: python3 -B -m unittest discover -s scripts/testing/startup-recovery-safety -v

      - name: Run Cargo tests
        run: cargo nextest run --workspace --exclude vibe-kanban-tauri

  tauri-checks:
    needs: [branch-policy, branch-freshness, changes]
    if: always() && (needs.branch-policy.result == 'success' || github.event_name == 'workflow_dispatch') && (needs.branch-freshness.result == 'success' || github.event_name == 'workflow_dispatch') && (needs.changes.outputs.tauri == 'true' || needs.changes.result == 'skipped')
    runs-on: *runner_label
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/cargo-checks-common-setup
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          cache-key: tauri-checks-${{ runner.os }}-${{ runner.arch }}-${{ env.RUNNER_LABEL }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev file pkg-config xdg-utils

      - name: Run Tauri fmt, clippy, and compile checks
        run: |
          cargo fmt --all --manifest-path crates/tauri-app/Cargo.toml -- --check
          cargo clippy --all-targets --manifest-path crates/tauri-app/Cargo.toml -- -D warnings
          cargo check -p vibe-kanban-tauri

  combined-capture-consent-acceptance:
    # Focused validation of the actual production baseline; normal PR/release
    # policy gates remain unchanged. This job never deploys or starts Vibe.
    if: github.event_name == 'workflow_dispatch'
    runs-on: *runner_label
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Bind disposable hosted storage
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/vk-combined-target" >> "$GITHUB_ENV"
          echo "VK_TEST_OUTPUT=$RUNNER_TEMP/vk-combined-ui" >> "$GITHUB_ENV"
          echo "TEST_RENDERER_PATH=$RUNNER_TEMP/vk-history-tools/node_modules/react-test-renderer" >> "$GITHUB_ENV"
          echo "VK_MCP_UI_RESPONSES=$RUNNER_TEMP/vk-combined-ui/mcp-ui-responses.json" >> "$GITHUB_ENV"
      - name: Setup Rust and Node
        uses: ./.github/actions/cargo-checks-common-setup
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy,rustfmt
          setup-node: "true"
          cache-key: combined-capture-consent-${{ runner.os }}
      - name: Verify bounded source and preserved live overlay
        run: python3 -B scripts/testing/combined-release-source.py
      - name: Mounted history and full consent UI regressions
        run: |
          mkdir -p dev_assets
          pnpm install --frozen-lockfile
          npm install --prefix "$RUNNER_TEMP/vk-history-tools" --no-package-lock --ignore-scripts react-test-renderer@18.3.1
          node scripts/testing/run-long-thread-history-tests.mjs
          node scripts/testing/run-mcp-approval-ui-tests.mjs
          node --experimental-strip-types --test packages/web-core/src/shared/lib/issueCreation.test.ts packages/web-core/src/pages/workspaces/workspaceAssignmentFilter.test.ts packages/web-core/src/pages/workspaces/workspaceSidebarPagination.test.ts
          node scripts/testing/run-kanban-issue-panel-tests.mjs
          pnpm run web-core:check
          pnpm run local-web:check
          pnpm run remote-web:check
      - name: Compiled queue, capture, HTTP, consent and rollback-format regressions
        run: |
          cargo test --locked -p utils --lib
          cargo test --locked -p server --test report_review_integration -- --test-threads=1
          cargo test --locked -p server --lib report_review -- --test-threads=1
          cargo test --locked -p server --lib historical_response -- --test-threads=1
          cargo test --locked -p executors --test mcp_consent_context
          cargo test --locked -p executors --lib elicitation::tests
          cargo test --locked -p executors --lib mcp_approval_card
          cargo test --locked -p services --lib elicitation_tests -- --test-threads=1
      - name: Compile all affected surfaces with warnings denied
        run: cargo clippy --locked -p utils -p executors -p services -p local-deployment -p server --all-targets -- -D warnings
      - name: Formatting and governance
        run: |
          pnpm run format
          git diff --exit-code
          cargo fmt --all -- --check
          pnpm --filter @vibe/web-core exec prettier --check src/features/workspace-chat/ui/McpConsentCards.tsx ../../.github/workflows/test.yml
          pnpm run ops:check
      - name: Build immutable paired server and frontend
        env:
          VK_EXPECTED_SOURCE: ${{ github.sha }}
          VK_ARTIFACT_DIR: ${{ runner.temp }}/vk-combined-artifact
        run: python3 -B scripts/build-combined-capture-consent.py
      - name: Upload hash-bound release candidate
        uses: actions/upload-artifact@v4
        with:
          name: combined-capture-consent-${{ github.sha }}
          path: ${{ runner.temp }}/vk-combined-artifact/
          compression-level: 6
          retention-days: 30
          if-no-files-found: error
